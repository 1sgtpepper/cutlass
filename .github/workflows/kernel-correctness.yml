name: Kernel correctness validation

on:
  push:
    branches: [validation/scale-and-gqa-correctness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: nvidia/cuda:13.1.1-devel-ubuntu24.04@sha256:9cf8694a27722418a1f175d90f85d5afb5a728fd4a9907d7f0565efecfa14d32
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: fp8_scale_wave
            arch: sm_90a
            virtual_arch: compute_90a
          - source: gqa_max_scratch
            arch: sm_100a
            virtual_arch: compute_100a
    defaults:
      run:
        shell: bash
    steps:
      - name: Install patch tooling
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record toolchain
        run: |
          mkdir -p build/correctness
          nvcc --version | tee build/correctness/toolchain.txt
          printf '%s\n' '${{ github.sha }}' > build/correctness/revision.txt
      - name: Prepare isolated causal controls
        run: |
          mkdir -p build/control
          cp --parents include/cutlass/gemm/collective/sm90_mma_tma_gmma_ss_warpspecialized_fp8_blockwise_scaling.hpp build/control/
          cp --parents examples/93_blackwell_low_latency_gqa/tgv_gqa.cuh build/control/
          git apply --directory=build/control test/regression/${{ matrix.source }}_control.patch
          cp test/regression/${{ matrix.source }}_control.patch build/correctness/control.patch
      - name: Compile baseline and causal control with the same oracle
        run: |
          set -o pipefail
          for variant in baseline control; do
            output=build/correctness/$variant
            mkdir -p "$output"
            extra_includes=()
            if [ "$variant" = control ]; then
              extra_includes=(-Ibuild/control/include -Ibuild/control/examples/93_blackwell_low_latency_gqa)
            fi
            nvcc -std=c++17 -O3 -lineinfo --expt-relaxed-constexpr \
              -gencode=arch=${{ matrix.virtual_arch }},code=${{ matrix.arch }} \
              "${extra_includes[@]}" -Iinclude -Itools/util/include \
              -Iexamples/93_blackwell_low_latency_gqa \
              --keep --keep-dir "$output" \
              test/regression/${{ matrix.source }}.cu \
              -o "$output/${{ matrix.source }}" \
              2>&1 | tee "$output/compile.log"
            cuobjdump --dump-sass "$output/${{ matrix.source }}" > "$output/kernel.sass"
          done
      - name: Observe CuTe scale aliasing on the CPU
        if: matrix.source == 'fp8_scale_wave'
        run: |
          set -o pipefail
          build/correctness/baseline/fp8_scale_wave --layouts | tee build/correctness/layouts.txt
      - name: Preserve validation evidence in the job log
        if: always()
        run: |
          find build/correctness -type f -exec sha256sum {} + > build/checksums.txt
          tar -czf kernel-evidence.tar.gz build/correctness build/checksums.txt
          sha256sum kernel-evidence.tar.gz
          echo 'BEGIN_KERNEL_EVIDENCE_BASE64'
          base64 -w 76 kernel-evidence.tar.gz
          echo 'END_KERNEL_EVIDENCE_BASE64'
