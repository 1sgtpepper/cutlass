name: Compile GQA mailbox controls

on:
  push:
    branches: [ci/fp8-gqa-fixes]
    paths: [.github/workflows/fix-candidates.yml, test/regression/gqa_max_scratch.cu]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: nvidia/cuda:13.1.1-devel-ubuntu24.04@sha256:9cf8694a27722418a1f175d90f85d5afb5a728fd4a9907d7f0565efecfa14d32
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: 59e3a3338d516ca6ce0e073af8da65289678a35c
            variant: baseline
          - revision: 246e9206cc1dce351fb8a90496effefdc86598a9
            variant: scratch
          - revision: ae3fd04b2891a952dc6b0ab4ad299ae90344f9be
            variant: mailbox
          - revision: b68800687e08cbc4aa7734b08d021ff07260fbce
            variant: both
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          path: source
      - name: Compile the existing numerical fixture against the exact fix
        run: |
          mkdir -p evidence
          git -C source rev-parse HEAD > evidence/revision.txt
          sha256sum source/examples/93_blackwell_low_latency_gqa/tgv_gqa.cuh > evidence/header.sha256
          cp test/regression/gqa_max_scratch.cu evidence/
          nvcc -std=c++17 -O3 -lineinfo --expt-relaxed-constexpr \
            -gencode=arch=compute_100a,code=sm_100a \
            -Isource/include -Isource/tools/util/include \
            -Isource/examples/93_blackwell_low_latency_gqa \
            --ptxas-options=-v test/regression/gqa_max_scratch.cu \
            -o evidence/gqa_max_scratch 2>&1 | tee evidence/fixture-compile.log
          cuobjdump --dump-sass evidence/gqa_max_scratch > evidence/kernel.sass
          git -C source diff --exit-code
      - name: Preserve compile evidence
        if: always()
        run: |
          mkdir -p evidence
          find evidence -type f -exec sha256sum {} + > checksums.txt
          cat checksums.txt
          tar -czf checks.tar.gz evidence checksums.txt
          echo BEGIN_CHECKS_BASE64
          base64 -w 76 checks.tar.gz
          echo END_CHECKS_BASE64
